name: release

# Publishes prebuilt weft-render binaries for every v* tag:
#   windows-x64 (.zip), linux-x64 (.tar.gz), macos-universal (.tar.gz)
# Mirrors the host job of ci.yml (same compilers, same deps) and adds
# packaging + a GitHub Release assembled from the three artifacts.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (defaults to the tag on tag-triggered runs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: windows-x64
            fmt: zip
          - os: ubuntu-latest
            arch: linux-x64
            fmt: tar.gz
          - os: macos-latest
            arch: macos-universal
            fmt: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Configure (Windows – MSVC)
        if: runner.os == 'Windows'
        # windows-latest = windows-2025-vs2026 image: VS 2026 generator.
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DWEFT_BUILD_HOST=ON

      - name: Configure (Linux – Ninja)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEFT_BUILD_HOST=ON

      - name: Configure (macOS – universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWEFT_BUILD_HOST=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target weft-render

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --target weft-render

      - name: Package (Windows – PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # zip(1) does not exist in the runner's Git-Bash — use Compress-Archive.
          # git describe on a tag push is the exact tag (vX.Y.Z); strip the v.
          $tag = & git describe --tags --exact-match
          if (-not $tag) { throw "not on a tag; pass ref v* or use workflow_dispatch" }
          $version = $tag.TrimStart('v')
          $bin = Get-ChildItem -Path build -Recurse -File |
            Where-Object { $_.Name -eq 'weft-render.exe' } |
            Select-Object -First 1
          if (-not $bin) { throw "weft-render.exe not found under build/" }
          $pkg = "weft-$version-windows-x64"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item $bin.FullName "$pkg/"
          Copy-Item README.md, LICENSE -Destination "$pkg/"
          Copy-Item -Recurse examples "$pkg/"
          Compress-Archive -Path $pkg -DestinationPath "${pkg}.zip"
          Get-ChildItem *.zip | Format-List Name, Length

      - name: Package (Linux / macOS – tar)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # weft-render lives under the host/ subdirectory's binary dir
          # (build/host on Make/Ninja) — locate it.
          version=$(git describe --tags --exact-match | sed 's/^v//')
          [ -n "$version" ] || { echo "::error::not on a tag"; exit 1; }
          bin=$(find build -name 'weft-render' -o -name 'weft-render.exe' | head -n1)
          [ -n "$bin" ] && [ -f "$bin" ] || { echo "::error::weft-render binary not found under build/"; exit 1; }
          echo "Packaging $bin"
          pkg="weft-${version}-${{ matrix.arch }}"
          mkdir -p "$pkg"
          cp "$bin" "$pkg/"
          cp README.md LICENSE "$pkg/"
          cp -r examples "$pkg/"
          tar -czf "${pkg}.tar.gz" "$pkg"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: weft-${{ matrix.arch }}
          path: |
            weft-*.zip
            weft-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show payload
        run: ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          name: "Weft ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}"
          files: dist/*
          generate_release_notes: true
