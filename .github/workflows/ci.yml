name: weft

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Configure (Windows – MSVC)
        if: runner.os == 'Windows'
        # windows-latest is the windows-2025-vs2026 image: ships VS 2026 +
        # CMake 4.4.x (has the "Visual Studio 18 2026" generator); no VS 2022.
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DWEFT_BUILD_HOST=ON

      - name: Configure (Linux / macOS – Ninja)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEFT_BUILD_HOST=ON

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target weft_smoke weft_smoke_plugin_VST3 --verbose

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake --build build --target weft_smoke weft_smoke_plugin_VST3 -v

      - name: Locate built VST3 plugin
        id: loc
        shell: bash
        run: |
          # Plugin output layout (see _juce_configure_bundle):
          #   win (VS gen): build/PlugIns/*_artefacts/Release/VST3/<Product>.vst3 (dir)
          #   lin:          build/PlugIns/*_artefacts/VST3/<Product>.vst3 (dir)
          #   mac:          build/PlugIns/*_artefacts/VST3/<Product>.vst3/Contents/Resources/moduleinfo.json
          find build \( -name 'moduleinfo.json' -o -name 'WeftSmokePlugin.vst3' \) > plugin_hits.txt
          if [ ! -s plugin_hits.txt ]; then
            echo "::error::no VST3 plugin artefact found under build/"
            exit 1
          fi
          hit=$(head -n1 plugin_hits.txt)
          if [ -d "$hit" ]; then
            vst3="$hit"                                   # win/linux: .vst3 is the bundle dir
          else
            vst3=$(cd "$hit/../../.." && pwd)             # mac: moduleinfo.json -> up 3 = bundle
          fi
          [ -d "$vst3" ] || { echo "::error::plugin dir missing: $vst3"; exit 1; }
          echo "path=$vst3" >> "$GITHUB_OUTPUT"
          echo "plugin at: $vst3"

      - name: Smoke (load plugin, dump params, verify plugin params)
        shell: bash
        run: |
          # Binary layout:
          #   win (VS gen): build/Release/weft_smoke.exe
          #   lin/mac:      build/weft_smoke
          smoke=$(find build -name 'weft_smoke' -o -name 'weft_smoke.exe' | head -n1)
          [ -n "$smoke" ] && [ -x "$smoke" ] || { echo "::error::smoke binary not found"; exit 1; }
          "$smoke" "${{ steps.loc.outputs.path }}" > smoke_out.json
          cat smoke_out.json
          python3 - <<'EOF'
          import json
          d = json.load(open("smoke_out.json"))
          assert d["pluginName"] == "WeftSmokePlugin", d["pluginName"]
          names = {p["title"] for p in d["params"]}
          # The VST3 wrapper (JUCE, plugin side) auto-injects a standard
          # "Bypass" param (id 'byps' = 0x62797073), so the host reports the
          # plugin's own params PLUS that injected one. Require the two real
          # params to be present with correct values; tolerate injected extras
          # (Bypass is a JUCE-injected bool, stepCount 2).
          assert {"DryMix", "Mode"} <= names, names
          dm = next(p for p in d["params"] if p["title"] == "DryMix")
          md = next(p for p in d["params"] if p["title"] == "Mode")
          # VST3 params are float32: 0.8f round-trips through JSON as
          # 0.800000011920929, so compare with a tolerance, not exact ==.
          assert dm["stepCount"] == 0 and abs(dm["defaultValue"] - 0.8) < 1e-5, dm
          # Raw VST3 ParameterInfo carries no value strings — JUCE's
          # VST3Parameter::getAllValueStrings() returns {} — so a choice
          # param hosted through the VST3 format reports listItems == [].
          # Assert the discrete step count instead of the label list.
          assert md["stepCount"] == 3 and md["listItems"] == [], md
          print("SMOKE OK")
          EOF
